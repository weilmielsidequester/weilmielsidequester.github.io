<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sidequester</title>
    <meta name="theme-color" content="#FDFCFB" />
    <style>
      html, body { height: 100%; margin: 0; background: #FDFCFB;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #6B6B76; display: grid; place-items: center; }
      a { color: #F2545B; }
    </style>
    <!--
      Bis zum Umzug lag die App im Wurzelverzeichnis, und diese Datei war
      ihre Einstiegsseite. Gespeicherte Adressen und Symbole auf dem
      Home-Bildschirm zeigen darum weiter hierher - und starteten damit
      eine monatealte Fassung der App.

      Jetzt leitet die Seite auf denselben Pfad unter /game/ weiter.
      Aus sidequester.ch/profil wird sidequester.ch/game/profil.
    -->
    <script>
      (function () {
        var pfad = location.pathname.replace(/^\/+/, '');
        if (pfad.indexOf('game/') === 0) return;   // niemals im Kreis
        location.replace('/game/' + pfad + location.search + location.hash);
      })();
    </script>
    <noscript><meta http-equiv="refresh" content="0;url=/game/" /></noscript>
  </head>
  <body>
    <p>Weiter zur App … <a href="/game/">sidequester.ch/game</a></p>
  </body>
</html>
