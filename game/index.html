<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: sonst bleibt unter der Home-Leiste des iPhones
         ein weisser Streifen, sobald die App vom Homescreen startet. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no, viewport-fit=cover" />
    <!-- Telefonnummern nicht automatisch verlinken – das macht Text blau. -->
    <meta name="format-detection" content="telephone=no" />

    <title>Sidequester</title>
    <meta name="description" content="Kleine Aufgaben für die echte Welt. Rausgehen, machen, beweisen." />

    <!-- Zum Home-Bildschirm hinzufügen: eigenes Icon, Vollbild ohne
         Safari-Leiste, Name unter dem Icon. -->
    <link rel="manifest" href="/game/manifest.json" />
    <link rel="apple-touch-icon" href="/game/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sidequester" />
    <!-- Gleiche Farbe wie der App-Hintergrund: Auf Android geht die
         Statusleiste so nahtlos in die App über. -->
    <meta name="theme-color" content="#FDFCFB" />

    <!-- Kein Vorschautext beim Teilen des Links, der nach Baustelle aussieht. -->
    <meta property="og:title" content="Sidequester" />
    <meta property="og:description" content="Kleine Aufgaben für die echte Welt. Rausgehen, machen, beweisen." />
    <meta property="og:type" content="website" />

    <!-- The `react-native-web` recommended style reset -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        /* Farbe aus tokens.js (color.bg) – ohne das blitzt beim Start
           kurz Weiss auf, bevor die App gezeichnet ist. */
        background-color: #FDFCFB;
        overscroll-behavior: none;
      }
      #root {
        display: flex;
        /* Wird per Skript auf die sichtbare Höhe gesetzt – bei offener
           Tastatur also nur der Bereich darüber. So bleibt das Eingabe-
           feld im Chat sichtbar, obwohl die Seite selbst fest steht. */
        height: var(--app-hoehe, 100%);
        flex: 1;
      }
      /* Langes Drücken soll keine Textauswahl auslösen – die App wird
         mit dem Finger bedient, nicht gelesen wie eine Webseite. */
      body, #root {
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }

      /* App-Gefühl statt Webseite:
         - kein Doppeltipp-Zoom (touch-action: manipulation)
         - keine Textauswahl beim Wischen, ausser in Eingabefeldern
         - keine hellen/dunklen Systemfarben in Formularfeldern */
      :root { color-scheme: light; }
      /* pan-x pan-y: Wischen und Scrollen ja, Zoomen nein. Anders als
         "manipulation" sperrt das auch das Zwei-Finger-Zoomen in Safari. */
      html, body, #root, * { touch-action: pan-x pan-y; }
      /* Die Seite selbst bleibt fest stehen – gescrollt wird nur innen
         in der App. Sonst verrutscht in Safari das ganze Bild, sobald man
         am Rand zieht oder die Tastatur aufgeht. */
      html, body {
        position: fixed;
        inset: 0;
        width: 100%;
        overflow: hidden;
        overscroll-behavior: none;
      }
      body {
        user-select: none;
        -webkit-user-select: none;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      input, textarea, [contenteditable="true"] {
        user-select: text;
        -webkit-user-select: text;
        /* Unter 16px zoomt iOS beim Antippen ins Feld hinein. */
        font-size: max(16px, 1em);
      }
      img { -webkit-user-drag: none; user-drag: none; }

      /* Am Computer: die App als Handy-Spalte in der Mitte statt über die
         ganze Breite gezogen. Auf dem Handy ändert sich nichts. */
      @media (min-width: 600px) {
        body { background-color: #EFECE8; }
        #root {
          max-width: 460px;
          margin: 0 auto;
          background-color: #FDFCFB;
          box-shadow: 0 0 0 1px rgba(22,20,46,.05), 0 24px 60px rgba(22,20,46,.10);
        }
      }
      /* Scrollbalken gehören zu einer Webseite, nicht zu einer App. */
      ::-webkit-scrollbar { width: 0; height: 0; }
    </style>
  <link rel="icon" href="/game/favicon.ico"/></head>

  <body>
    <noscript>
      Sidequester braucht JavaScript. Bitte im Browser aktivieren.
    </noscript>
    <div id="root"></div>
    <!-- Von Joscha: schmalere Login-Spalte am Computer und Link "Über das
         Projekt" auf die Landingpage /home. Fest drin, damit es kein Build
         mehr überschreibt. -->
    <script defer src="/game/home-verweis.js"></script>

    <script>
      // Zoom blockieren – auch dort, wo das Viewport-Attribut allein nicht
      // reicht (Safari ignoriert user-scalable seit iOS 10).
      (function () {
        var stop = function (e) { e.preventDefault(); };
        // Zwei-Finger-Zoom in Safari
        document.addEventListener('gesturestart', stop, { passive: false });
        document.addEventListener('gesturechange', stop, { passive: false });
        document.addEventListener('gestureend', stop, { passive: false });
        // Strg/Cmd + Scrollrad am Computer
        document.addEventListener('wheel', function (e) {
          if (e.ctrlKey || e.metaKey) e.preventDefault();
        }, { passive: false });
        // Strg/Cmd + Plus/Minus/0
        document.addEventListener('keydown', function (e) {
          if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0'].indexOf(e.key) !== -1) e.preventDefault();
        });
        // Doppeltipp-Zoom: zwei Tipps unter 300 ms zählen als einer –
        // aber nicht in Eingabefeldern, dort markiert Doppeltipp ein Wort.
        // Ausnahme: die Vollbild-Bildansicht zoomt selber. Dort dürfen die
        // Finger nicht abgefangen werden, sonst bricht Safari die Geste ab.
        function imBild(e) {
          var t = e.target;
          return !!(t && t.closest && t.closest('[data-zoombar]'));
        }
        var letzter = 0;
        document.addEventListener('touchend', function (e) {
          if (imBild(e)) return;
          var jetzt = Date.now();
          var feld = e.target && /INPUT|TEXTAREA/.test(e.target.tagName);
          if (!feld && jetzt - letzter < 300) e.preventDefault();
          letzter = jetzt;
        }, { passive: false });
        // Zwei Finger auf dem Bildschirm = Zoomversuch. Abfangen.
        document.addEventListener('touchmove', function (e) {
          if (imBild(e)) return;
          if (e.touches && e.touches.length > 1) e.preventDefault();
        }, { passive: false });
        // Sichtbare Höhe mitführen: Tastatur auf = App wird kürzer, statt
        // dass Safari die ganze Seite nach oben schiebt.
        var vv = window.visualViewport;
        function hoeheAnpassen() {
          var h = vv ? vv.height : window.innerHeight;
          document.documentElement.style.setProperty('--app-hoehe', h + 'px');
          if (window.scrollY) window.scrollTo(0, 0);
        }
        if (vv) {
          vv.addEventListener('resize', hoeheAnpassen);
          vv.addEventListener('scroll', hoeheAnpassen);
        }
        window.addEventListener('resize', hoeheAnpassen);
        hoeheAnpassen();
        // Wenn die Tastatur zugeht, schiebt Safari die Seite manchmal nicht
        // zurück. Dann wieder nach oben setzen.
        document.addEventListener('focusout', function () {
          setTimeout(hoeheAnpassen, 60);
        });
        // Langes Drücken öffnet kein Browser-Menü.
        document.addEventListener('contextmenu', function (e) {
          if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
          e.preventDefault();
        });
      })();
    </script>
  <script src="/game/entry-ff33bf6233c113331e2c2c9fd78b9d0e.js" defer></script>
</body>
</html>
